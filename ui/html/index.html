<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVE Analyzer — Security Vulnerability Intelligence</title>
    
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>CVE Analyzer</h1>
            <p>Direct, insightful, and reliable security vulnerability data.</p>
            <div id="userSection" style="display: none; margin-top: 1rem; align-items: center; gap: 1rem;">
                <span id="userEmail" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
                <span id="tokenStatus" style="font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: oklch(76.1% 0.16 142.49 / 0.1); color: var(--accent-green); border: 1px solid oklch(76.1% 0.16 142.49 / 0.3);">Personal Quota Active</span>
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
            <div id="loginSection" style="display: none; margin-top: 1rem;">
                <a href="/login" class="logout-btn" style="background: var(--accent-blue); color: var(--bg-primary); border: none;">Sign in with Google</a>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="search-section" aria-labelledby="searchHeading">
                <h2 id="searchHeading" class="sr-only">Search CVE</h2>
                <form id="searchForm" class="search-form">
                    <label for="cveInput" class="sr-only">CVE ID (e.g., CVE-2023-1234)</label>
                    <input 
                        type="text" 
                        id="cveInput" 
                        class="cve-input"
                        placeholder="Enter CVE ID (e.g., CVE-2023-1234)" 
                        required
                        autocomplete="off"
                    >
                    <button type="submit" id="submitBtn" class="search-btn" disabled>
                        Analyze CVE
                    </button>
                </form>
            </section>

            <div id="resultContainer" class="result-container" style="display: none;">
                <!-- Results populated by JavaScript -->
            </div>
        </div>
    </main>

    <script src="/static/js/app.js" defer></script>
</body>
</html>
