<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVE Vulnerability Analyzer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>CVE Vulnerability Analyzer</h1>
            <p>AI-powered security vulnerability analysis</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="search-section">
                <form id="searchForm" class="search-form">
                    <input 
                        type="text" 
                        id="cveInput" 
                        class="cve-input"
                        placeholder="Enter CVE ID (e.g., CVE-2023-1234)" 
                        required
                        autocomplete="off"
                    >
                    <button type="submit" id="submitBtn" class="search-btn" disabled>
                        Analyze CVE
                    </button>
                </form>
            </section>

            <div id="resultContainer" class="result-container" style="display: none;">
                <!-- Results will be populated here -->
            </div>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
